# Success messages configuration
MSG001=ユーザの登録が完了しました。
MSG002=ユーザの更新が完了しました。
MSG003=ユーザの削除が完了しました。

# Error messages configuration
ER001=「{0}」を入力してください
ER002=「{0}」を選択してください
ER003=「{0}」は既に存在しています。
ER004=「{0}」は存在していません。
ER005=「{0}」を{1}形式で入力してください
ER006={1}桁以内の「{0}」を入力してください
ER007=「{0}」を{1}<= 桁数、<={2} 桁で入力してください
ER008=「{0}」に半角英数を入力してください
ER009=「{0}」をカタカナで入力してください
ER011=「{0}」は無効になっています。
ER012=「{0}」は「{1}」より未来の日で入力してください。
ER013=該当するユーザは存在していません。
ER015=システムエラーが発生しました。
ER018={0}は半角数字で入力してください。
ER019=[{0}]は(a-z, A-Z, 0-9 と _)の桁のみです。最初の桁は数字ではない。
ER021=ソート順はASCまたはDESCで指定してください。
ER023=該当するデータが見つかりません。
